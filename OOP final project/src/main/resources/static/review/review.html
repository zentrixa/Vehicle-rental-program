<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Your Rental</title>

    <style>
        :root {
            --bg-offwhite: #f3f3f0;
            --card-white: #ffffff;
            --input-bg: #f8f8f6;
            --border-soft: #e5e5e0;
            --text-dark: #121212;
            --text-muted: #6b6b6b;
            --uber-star: #ffc043;
            --green: #06c167;
            --red: #e11d48;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            min-height: 100vh;
            background-color: var(--bg-offwhite);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 16px;
            color: var(--text-dark);
        }

        .card {
            background-color: var(--card-white);
            width: 100%;
            max-width: 420px;
            padding: 32px 28px;
            border-radius: 16px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.05);
            border: 1px solid var(--border-soft);
        }

        .header h1 {
            font-size: 1.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .input-control {
            width: 100%;
            padding: 12px 14px;
            font-size: 0.95rem;
            border: 1px solid var(--border-soft);
            border-radius: 8px;
            background-color: var(--input-bg);
            color: var(--text-dark);
            outline: none;
        }

        .input-control:focus {
            border-color: var(--text-dark);
            background-color: #ffffff;
        }

        textarea.input-control {
            height: 90px;
            resize: none;
        }

        .rating-section {
            text-align: center;
            margin-bottom: 16px;
            padding: 14px;
            background-color: var(--input-bg);
            border-radius: 12px;
            border: 1px solid var(--border-soft);
        }

        .rating-section label {
            display: block;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .stars {
            display: flex;
            justify-content: center;
            direction: rtl;
            gap: 8px;
        }

        .stars input { display: none; }

        .stars label {
            font-size: 2rem;
            color: #d1d1cc;
            cursor: pointer;
            transition: color 0.15s ease;
        }

        .stars input:checked ~ label,
        .stars label:hover,
        .stars label:hover ~ label {
            color: var(--uber-star);
        }

        .btn-uber {
            width: 100%;
            padding: 14px;
            margin-top: 8px;
            background-color: var(--text-dark);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .btn-uber:hover { background-color: #2c2c2c; }
        .btn-uber:disabled { opacity: 0.6; cursor: not-allowed; }

        .alert {
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 16px;
            display: none;
        }

        .alert-error {
            background-color: rgba(225, 29, 72, 0.1);
            color: var(--red);
            border: 1px solid rgba(225, 29, 72, 0.2);
        }

        .alert-success {
            background-color: rgba(6, 193, 103, 0.1);
            color: var(--green);
            border: 1px solid rgba(6, 193, 103, 0.2);
        }
    </style>
</head>
<body>

<div class="card">
    <div class="header">
        <h1>Rate your rental</h1>
        <p>Enter your details to leave feedback</p>
    </div>

    <div id="alertBox" class="alert"></div>

    <!-- Form submits directly via POST to our Java Controller endpoint -->
    <form id="reviewForm" action="/reviews/submit" method="POST">

        <div class="input-group">
            <label for="username">Your Name / Booking ID</label>
            <input type="text" id="username" name="username" class="input-control" placeholder="e.g. John Doe" required>
        </div>

        <div class="rating-section">
            <label>Select Rating</label>
            <div class="stars">
                <input type="radio" id="star5" name="rating" value="5" required><label for="star5">★</label>
                <input type="radio" id="star4" name="rating" value="4"><label for="star4">★</label>
                <input type="radio" id="star3" name="rating" value="3"><label for="star3">★</label>
                <input type="radio" id="star2" name="rating" value="2"><label for="star2">★</label>
                <input type="radio" id="star1" name="rating" value="1"><label for="star1">★</label>
            </div>
        </div>

        <div class="input-group">
            <label for="comment">Rental Feedback</label>
            <textarea id="comment" name="comment" class="input-control" placeholder="How was the vehicle condition and driving experience?" required></textarea>
        </div>

        <button type="submit" id="submitBtn" class="btn-uber">Submit Verified Review</button>
    </form>
</div>

</body>
</html>
