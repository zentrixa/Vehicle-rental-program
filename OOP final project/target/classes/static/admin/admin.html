<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customers | Kerbside admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="../css/site.css" rel="stylesheet">
</head>
<body>

    <header class="site-header">
        <a class="brand" href="/admin/admin.html">Kerbside</a>
        <nav class="site-nav" aria-label="Account">
            <a href="/listingpage/listingpage.html">Listing page</a>
            <a href="/profile/profile.html">Profile</a>
            <button type="button" class="link-button" data-logout>Log out</button>
        </nav>
    </header>

    <main class="page">
        <h1>Customers</h1>
        <p class="page-sub" id="welcome"></p>

        <form class="search-bar" id="searchForm" role="search">
            <label class="visually-hidden" for="searchInput">Search customers</label>
            <input type="search" id="searchInput" placeholder="Search by username or member number"
                   autocomplete="off" spellcheck="false">
            <button type="submit" class="btn btn-primary">Search</button>
            <button type="button" class="btn btn-outline-dark" id="clearButton" hidden>Show all</button>
        </form>

        <p class="form-success" id="adminMsg" role="status" hidden></p>
        <p class="form-error" id="adminError" role="alert" hidden></p>
        <p class="result-count" id="resultCount" aria-live="polite"></p>

        <table class="customers" id="customerTable" hidden>
            <thead>
                <tr>
                    <th scope="col">Member no.</th>
                    <th scope="col">Username</th>
                    <th scope="col">Email</th>
                    <th scope="col">Contact</th>
                    <th scope="col">Licence</th>
                    <th scope="col">Membership</th>
                    <th scope="col"><span class="visually-hidden">Actions</span></th>
                </tr>
            </thead>
            <tbody id="customerRows"></tbody>
        </table>

        <div class="empty" id="emptyState" hidden>
            <h2 id="emptyTitle"></h2>
            <p id="emptyText"></p>
        </div>
    </main>

    <dialog id="deleteDialog" aria-labelledby="deleteTitle" aria-describedby="deleteText">
        <h2 id="deleteTitle">Delete this customer?</h2>
        <p id="deleteText"></p>
        <div class="actions">
            <button type="button" class="btn btn-outline-dark" id="cancelDelete">Cancel</button>
            <button type="button" class="btn btn-danger" id="confirmDelete">Delete customer</button>
        </div>
    </dialog>

<script src="../js/common.js"></script>
<script src="../js/session.js"></script>
<script src="adminfunc.js"></script>
</body>
</html>
