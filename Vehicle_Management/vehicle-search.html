<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Search vehicles | Kerbside</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="vehicle.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <a class="brand" href="/vehicle/vehicle-list.html">Kerbside</a>
    <nav class="site-nav vehicle-nav">
        <a href="/vehicle/vehicle-list.html">Vehicles</a>
        <a href="/vehicle/vehicle-search.html">Search</a>
        <a href="/vehicle/add-vehicle.html">Add vehicle</a>
    </nav>
</header>

<main class="page">
    <h1>Search vehicles</h1>
    <p class="page-sub">Search by brand, type or category. Leave a box empty to show everything.</p>

    <form id="searchForm" class="search-filters">
        <div class="field">
            <label for="brand">Brand or model</label>
            <input type="search" id="brand" placeholder="e.g. Toyota">
        </div>
        <div class="field">
            <label for="type">Type</label>
            <select id="type">
                <option value="">Any type</option>
                <option>Car</option>
                <option>Van</option>
                <option>Motorcycle</option>
            </select>
        </div>
        <div class="field">
            <label for="category">Category</label>
            <select id="category">
                <option value="">Any category</option>
                <option>Economy</option>
                <option>Standard</option>
                <option>Luxury</option>
            </select>
        </div>
        <div class="field">
            <label for="days">Rental days</label>
            <input type="number" id="days" min="1" max="365" value="3">
        </div>
        <div class="field">
            <label class="check"><input type="checkbox" id="premium"> Premium member (5% off)</label>
        </div>
        <div class="search-actions">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
    </form>

    <p class="result-count" id="countText"></p>
    <div class="vehicle-cards" id="results"></div>
</main>

<script src="vehicle.js"></script>
<script src="vehiclesearch.js"></script>
</body>
</html>
