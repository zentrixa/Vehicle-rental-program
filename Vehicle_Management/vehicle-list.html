<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vehicles | Kerbside</title>
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800&family=Overpass+Mono:wght@500&display=swap" rel="stylesheet">
    <link href="vehicle.css" rel="stylesheet">
</head>
<body>

<header class="site-header">
    <a class="brand" href="/vehicle/vehicle-list.html">Kerbside</a>
    <nav class="site-nav vehicle-nav">
        <a href="/vehicle/vehicle-list.html">Vehicles</a>
        <a href="/vehicle/vehicle-search.html">Search</a>
        <a href="/vehicle/add-vehicle.html">Add vehicle</a>
    </nav>
</header>

<main class="page">
    <h1>Vehicles</h1>
    <p class="page-sub">All vehicles in the rental fleet.</p>

    <div class="actions">
        <a class="btn btn-primary" href="/vehicle/add-vehicle.html">Add a vehicle</a>
    </div>

    <p class="form-success" id="successMsg" hidden></p>
    <p class="form-error" id="errorMsg" hidden></p>
    <p class="result-count" id="countText"></p>

    <table class="vehicle-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>Vehicle</th>
                <th>Plate</th>
                <th>Category</th>
                <th>Mileage</th>
                <th>Daily rate</th>
                <th>7 days</th>
                <th>Status</th>
                <th></th>
            </tr>
        </thead>
        <tbody id="vehicleRows"></tbody>
    </table>
</main>

<script src="vehicle.js"></script>
<script src="vehiclelist.js"></script>
</body>
</html>
