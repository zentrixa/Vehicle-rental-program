<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vehicles | Vehicle Rental Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/vehicle.css">
</head>
<!-- MEMBER 2 - Vehicle Listing Page (Read all + quick status Update + Delete) -->
<body data-nav="admin" data-area="admin" data-admin="vehicles" data-page="list">
<script>/* Shown only when a page is opened directly instead of through the running server */if(location.protocol==="file:"||location.port==="63342"){document.write('<div style="position:fixed;inset:0;z-index:9999;background:#0d1f20;color:#fff;font:16px/1.6 system-ui,sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center"><div style="max-width:560px"><h1 style="color:#34c77b;margin:0 0 12px;font-size:26px">Start the server first</h1><p>This page was opened as a file, so it cannot load vehicles, bookings or styles.</p><p>In IntelliJ run <b>VehicleRentalApplication</b> (green Run button), then open <a style="color:#34c77b" href="http://localhost:8080">http://localhost:8080</a> in your browser.</p></div></div>');}</script>
<header id="site-header"></header>

<main>
  <section class="page-band">
    <div class="wrap">
      <div class="crumbs"><a href="/admin/dashboard.html">Dashboard</a> / Vehicles</div>
      <h1>Fleet register</h1>
      <p>Every vehicle in vehicles.txt. Change availability straight from the table.</p>
      <div class="band-actions"><a class="btn" href="/vehicles/add.html">Add a vehicle</a></div>
    </div>
    <div class="lane"></div>
  </section>

  <section class="page-body">
    <div class="wrap">
      <div class="mini-stats">
        <div><span>Vehicles in fleet</span><strong id="vTotal">0</strong></div>
        <div><span>Available</span><strong id="vAvailable">0</strong></div>
        <div><span>On rent</span><strong id="vRented">0</strong></div>
        <div><span>In maintenance</span><strong id="vMaintenance">0</strong></div>
      </div>

      <div class="toolbar">
        <div class="search-box">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input class="input" id="listSearch" placeholder="Search brand, model or plate">
        </div>
        <div class="chips" id="statusChips">
          <button class="chip on" data-status="">All</button>
          <button class="chip" data-status="AVAILABLE">Available</button>
          <button class="chip" data-status="RENTED">On rent</button>
          <button class="chip" data-status="MAINTENANCE">Maintenance</button>
        </div>
        <select class="select-sm" id="typeSelect" aria-label="Filter by type">
          <option value="">All types</option><option value="CAR">Cars</option><option value="VAN">Vans</option><option value="MOTORCYCLE">Motorcycles</option>
        </select>
      </div>

      <div class="table-wrap">
        <table class="data">
          <thead><tr><th>Vehicle</th><th>Plate</th><th>Type</th><th>Branch</th><th>Rate / day</th><th>Mileage</th><th>Status</th><th></th></tr></thead>
          <tbody id="vehicleRows"></tbody>
        </table>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<script src="/js/app.js"></script>
<script src="/js/vehicle.js"></script>
</body>
</html>
